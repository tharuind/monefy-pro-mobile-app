name: Build MyMoney Android APK
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.personal.finance --project-name mymoney .
      - name: Configure Android project
        run: python3 scripts/configure_android.py
      - name: Fetch packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build installable APK
        run: flutter build apk --debug
      - name: Publish build file
        uses: actions/upload-artifact@v4
        with:
          name: MyMoney-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
