name: Build MyMoney Android APK
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.personal.finance --project-name mymoney platform_shell
          cp -R platform_shell/android ./android
          cp platform_shell/.metadata ./.metadata
      - name: Configure Android project
        run: python3 scripts/configure_android.py
      - name: Fetch packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build installable APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID }}
        run: |
          for name in FIREBASE_API_KEY FIREBASE_ANDROID_APP_ID FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository variable before building the cloud-sync APK."
              exit 1
            fi
          done
          flutter build apk --debug \
            --dart-define=FIREBASE_CONFIGURED=true \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_WEB_CLIENT_ID=$FIREBASE_WEB_CLIENT_ID"
      - name: Publish build file
        uses: actions/upload-artifact@v4
        with:
          name: MyMoney-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
