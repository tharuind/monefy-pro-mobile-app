name: mymoney
version: 0.1.0+1
description: Offline personal income and expense tracker.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  aes256: ^2.2.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
